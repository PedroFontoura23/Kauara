<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="connect-src 'self' data: https://www.gstatic.com https://www.googleapis.com https://firestore.googleapis.com ws://localhost:5001 wss://firestore.googleapis.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://api.mercadopago.com https://www.mercadolibre.com https://api.mercadolibre.com https://events.mercadopago.com https://us-central1-kauara1.cloudfunctions.net">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Canvas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #fafafa;
      color: #222;
    }
    h2 { margin-bottom: 15px; }
    #view-buttons {
      margin: 15px 0;
    }
    .view-btn {
      padding: 8px 14px;
      margin-right: 8px;
      border: 1px solid #3b82f6;
      background: #e0e7ff;
      color: #3b82f6;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    .view-btn.active {
      background: #3b82f6;
      color: white;
      border-color: #3b82f6;
    }
    .view-btn:hover {
      background: #c7d2fe;
    }
    .canvas-container {
      width: 800px;
      height: 600px;
      border: 1px solid #ccc;
      overflow: hidden;
    }
    #product-canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .controls {
      margin: 20px 0;
      padding: 15px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
    }
    .control-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    button {
      padding: 10px 15px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 10px;
    }
    button:hover { background: #2563eb; }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .scale-control {
      margin: 15px 0;
    }
    .scale-control label {
      display: inline-block;
      margin-right: 10px;
    }
    .scale-control input {
      vertical-align: middle;
    }
    #scale-value {
      display: inline-block;
      min-width: 40px;
      margin-left: 10px;
    }
    .color-indicator {
      display: inline-block;
      width: 16px;
      height: 16px;
      border-radius: 3px;
      margin-right: 8px;
      vertical-align: middle;
      border: 1px solid #ccc;
    }
    #save-side {
      margin: 15px 0;
    }
    #save-side label {
      display: inline-block;
      margin-right: 15px;
      cursor: pointer;
    }
    #price-controls {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 6px;
      background: #f9f9f9;
    }
    #price-controls label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    #price-controls input {
      margin-bottom: 15px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 100%;
      max-width: 200px;
    }
    #price-controls input[readonly] {
      background-color: #f5f5f5;
    }
    #save-side input {
      margin-right: 5px;
    }
    .price-control {
      margin: 15px 0;
    }
    .price-control label {
      display: inline-block;
      margin-right: 10px;
      font-weight: bold;
    }
    .price-control input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 100px;
    }
    .art-info {
      background: #f0f8ff;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      border-left: 4px solid #3b82f6;
    }
    .art-info h3 {
      margin-top: 0;
      color: #3b82f6;
    }
    .art-info p {
      margin: 5px 0;
    }
    .pricing-section {
      margin: 20px 0;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 6px;
      border: 1px solid #dee2e6;
    }
    .pricing-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 8px;
      background: white;
      border-radius: 4px;
    }
    .pricing-row:last-child {
      font-weight: bold;
      background: #e9ecef;
    }
    .price-breakdown {
      margin-top: 10px;
    }
    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      margin-bottom: 6px;
      background: white;
      border-radius: 4px;
      border: 1px solid #e9ecef;
    }
    .price-row.fee-row {
      background: #fffbf0;
      border-color: #fde8a0;
    }
    .price-row.total-row {
      background: #e9ecef;
      border-color: #ced4da;
      margin-top: 4px;
      font-size: 1.05em;
    }
    .price-label {
      display: flex;
      flex-direction: column;
    }
    .price-label small {
      color: #888;
      font-size: 0.8em;
      font-weight: normal;
    }
    .price-amount {
      font-weight: 500;
      color: #222;
      white-space: nowrap;
      margin-left: 16px;
    }
    .total-amount {
      font-size: 1.1em;
      color: #1a56db;
    }
    .selected-variant-info {
      margin-bottom: 10px;
    }
    .variant-display {
      display: flex;
      gap: 10px;
      font-size: 0.9em;
      color: #555;
    }
    .price-range-info {
      margin-top: 10px;
      color: #666;
      font-size: 0.85em;
    }
    /* Size selector */
    .size-btn {
      padding: 7px 14px;
      border: 2px solid #ccc;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9em;
      transition: all 0.15s;
      min-width: 44px;
      text-align: center;
    }
    .size-btn:hover {
      border-color: #3b82f6;
      color: #3b82f6;
    }
    .size-btn.selected {
      background: #3b82f6;
      border-color: #3b82f6;
      color: #fff;
    }
    .size-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: #ddd;
    }
    #size-loading {
      color: #888;
      font-size: 0.9em;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>Product Canvas</h1>
  
  <!-- Art Information Display -->
  <div id="art-info" class="art-info">
    <h3 id="art-name">Art Name</h3>
    <p id="art-description"></p>
    <p id="art-price">Price: R$ 0.00</p>
  </div>
  
  <div id="view-buttons">
    <button id="front-btn" class="view-btn active">Front View</button>
    <button id="back-btn" class="view-btn">Back View</button>
  </div>

  <div class="canvas-container">
    <canvas id="product-canvas"></canvas>
  </div>

  <div class="controls">
    <div class="control-group scale-control">
      <label for="scale-slider">Scale:</label>
      <input type="range" id="scale-slider" min="10" max="500" value="100" step="5">
      <span id="scale-value">100%</span>
    </div>

    <div class="control-group" id="size-selector-group">
      <label>Size:</label>
      <div id="size-selector" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;">
        <!-- populated by JS -->
      </div>
    </div>

    <div class="pricing-section">
      <h3>Pricing Details</h3>
      <div class="price-breakdown">
        <div class="price-row">
          <div class="price-label"><span>Product Base Price</span></div>
          <div class="price-amount" id="base-price">R$ 0.00</div>
        </div>
        <div class="price-row">
          <div class="price-label">
            <span>Art Price</span>
            <small id="art-name-display"></small>
          </div>
          <div class="price-amount" id="art-price-display">R$ 0.00</div>
        </div>
        <div class="price-row fee-row">
          <div class="price-label">
            <span>Platform Fee</span>
            <small>(R$ 5,00 fixed fee)</small>
          </div>
          <div class="price-amount" id="platform-fee">R$ 0.00</div>
        </div>
        <div class="price-row total-row">
          <div class="price-label"><strong>Total Price</strong></div>
          <div class="price-amount total-amount" id="total-price"><strong>R$ 0.00</strong></div>
        </div>
      </div>
    </div>
    
    <div id="save-side">
      <label>
        <input type="radio" name="saveSide" value="front" checked>
        Save Front Side
      </label>
      <label>
        <input type="radio" name="saveSide" value="back">
        Save Back Side
      </label>
    </div>
    
    <button id="save-btn">Save Product</button>
  </div>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <!-- Firebase initialization — must come before canvas-client.js -->
  <script src="javascript/shared-firebase-init.js"></script>

  <!-- Áreas de impressão compartilhadas — deve vir ANTES do canvas script -->
  <script src="javascript/canvas-client.js"></script>
  <script src="javascript/shared-firebase-init.js"></script>
</body>
</html>
