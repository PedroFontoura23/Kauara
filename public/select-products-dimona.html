<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Selecionar Produto</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#fafafa;color:#222}
  .top-bar{background:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;position:sticky;top:0;z-index:20}
  .stats{font-size:.9rem;color:#666;display:flex;align-items:center;gap:.5rem}
  #refresh-btn{background:#667eea;color:#fff;border:none;padding:.35rem .6rem;border-radius:6px;cursor:pointer}
  #refresh-btn:hover{background:#5568d6}
  .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.25rem;padding:1.5rem}
  .product-card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 6px 20px rgba(10,10,10,.06);display:flex;flex-direction:column;transition:transform .14s ease;cursor:pointer}
  .product-card:hover{transform:translateY(-6px)}
  .product-image{width:100%;height:200px;object-fit:contain;background:linear-gradient(135deg,#f6f6f6,#ececec)}
  .product-title{font-weight:700;font-size:1.05rem;margin:.7rem 1rem 0}
  .product-info{color:#666;font-size:.88rem;margin:.35rem 1rem 1rem}
  .loading,.error{padding:2rem;text-align:center;color:#555}
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;overflow-y:auto;padding:20px 0}
  .modal-content{background:#fff;width:min(95%,720px);margin:0 auto 40px;border-radius:12px;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.25);position:relative;max-height:calc(100vh - 80px);overflow-y:auto}
  .close-modal{position:sticky;top:0;float:right;font-size:26px;color:#999;cursor:pointer;background:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;margin-left:auto;margin-bottom:10px}
  .close-modal:hover{color:#333}
  .flatlay-container{text-align:center;margin-bottom:12px}
  .flatlay-img{max-width:100%;border-radius:8px;margin:auto;display:block;background:#f5f5f5}
  .variant-section{margin-top:8px}
  .section-title{font-weight:600;margin:8px 0}
  .variant-selection-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:6px}
  .variant-option{padding:9px;border-radius:8px;border:1px solid #e6e6e6;text-align:center;cursor:pointer;background:#fff;transition:all .12s}
  .variant-option:hover{background:#f8fbff}
  .variant-option.selected{border-color:#3b82f6;background:#eff6ff}
  .color-dot{display:inline-block;width:18px;height:18px;border-radius:50%;margin-bottom:6px;border:1px solid #ccc}
  .selected-colors-container{margin-top:16px;padding-top:12px;border-top:1px solid #eee}
  .selected-colors{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .selected-color{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#f5f5f5;border-radius:20px;font-size:0.85rem}
  .selected-color-dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,0.1)}
  .remove-color{cursor:pointer;color:#999;font-size:1rem;line-height:1}
  .remove-color:hover{color:#f44336}
  .confirm-button{position:sticky;bottom:0;width:100%;margin-top:10px;padding:11px 14px;border-radius:9px;border:none;font-size:15px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;cursor:pointer}
  .confirm-button:disabled{background:#ccc;cursor:not-allowed}
  @media(max-width:480px){
    .product-image{height:160px}
    .variant-selection-grid{grid-template-columns:repeat(2,1fr)}
    .modal-content{margin:0 auto 20px;max-height:calc(100vh - 40px);padding:12px}
    .modal{padding:10px 0}
  }
</style>
</head>
<body>
  <header class="top-bar">
    <h2>Selecionar Produto</h2>
    <div class="stats">
      <span id="product-count">0</span> produtos
      <button id="refresh-btn" title="Recarregar produtos">⟳</button>
    </div>
  </header>

  <main>
    <div id="loading" class="loading">Carregando produtos...</div>
    <div id="error" class="error" style="display:none"></div>
    <div id="products" class="product-grid"></div>
  </main>

  <button id="create-art-btn" style="background:#764ba2;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;margin-right:10px;">
    Criar Arte
  </button>

  <div id="variant-modal" class="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true">
      <span class="close-modal" title="Fechar">&times;</span>
      <h3>Escolha as cores</h3>
      <div class="flatlay-container">
        <canvas id="flatlay-canvas" class="flatlay-img"></canvas>
      </div>
      <div id="variant-selection"></div>
      <div class="selected-colors-container">
        <div class="section-title">Cores selecionadas</div>
        <div id="selected-colors" class="selected-colors"></div>
      </div>
      <button id="confirm-variant" class="confirm-button" disabled>Continuar para o Canvas</button>
    </div>
  </div>

  <script src="/javascript/select-product-dimona.js"></script>
</body>
</html>
