<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* ── Base ── */
        *, *::before, *::after { box-sizing: border-box; }
        body { background: #f5f5f5; margin: 0; -webkit-tap-highlight-color: transparent; }

        .produto-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px;
        }

        /* ── Header ── */
        .produto-header h1 {
            font-size: clamp(1.1rem, 4vw, 1.5rem);
            font-weight: 700;
            margin: 0;
            line-height: 1.3;
        }
        .produto-header .price {
            font-size: clamp(1rem, 3.5vw, 1.25rem);
            font-weight: 600;
            color: #0d6efd;
        }

        /* Share button */
        .btn-share {
            border: none;
            background: none;
            color: #555;
            font-size: 1rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            transition: background .15s;
            white-space: nowrap;
            flex-shrink: 0;
            min-height: 44px;
        }
        .btn-share:hover { background: #eee; }

        /* ── 2-col desktop grid ── */
        .produto-body {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 24px;
            margin-top: 16px;
        }

        /* ── Left column ── */
        .produto-left { display: flex; flex-direction: column; gap: 16px; }

        .produto-img-wrap {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 360px;
            max-height: 480px;
            padding: 20px;
            overflow: hidden;
        }
        .produto-img-wrap img {
            max-width: 100%;
            max-height: 440px;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .img-side-btns {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .img-side-btns .side-btn {
            min-height: 40px;
            padding: 6px 18px;
            font-size: 0.875rem;
        }

        .produto-label {
            text-align: center;
            color: #888;
            font-size: 0.85rem;
            margin: 0;
        }

        /* ── Selector card ── */
        .selector-card {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            padding: 16px;
        }
        .selector-card h6 {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: #888;
            margin-bottom: 12px;
            font-weight: 600;
        }

        /* ── Color dots ── */
        .color-dots {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .color-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #ccc;
            cursor: pointer;
            transition: border-color .15s, transform .15s;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .color-dot.active, .color-dot:hover { border-color: #0d6efd; transform: scale(1.15); }
        #selected-color-name { font-size: 0.82rem; color: #555; }

        /* ── Size chips ── */
        .size-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .size-chip {
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #fff;
            padding: 11px 4px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all .15s;
            text-align: center;
            min-height: 44px;
            -webkit-tap-highlight-color: transparent;
        }
        .size-chip:hover:not(:disabled) { border-color: #0d6efd; color: #0d6efd; }
        .size-chip.active { background: #0d6efd; color: #fff; border-color: #0d6efd; }
        .size-chip:disabled { opacity: .4; cursor: not-allowed; }

        /* ── Action buttons ── */
        .produto-actions {
            display: flex;
            gap: 10px;
        }
        .produto-actions .btn {
            flex: 1;
            padding: 13px 10px;
            font-size: 0.95rem;
            min-height: 48px;
            white-space: nowrap;
        }

        /* ── Right: comments ── */
        .produto-right { display: flex; flex-direction: column; gap: 12px; }
        .comments-title {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: #888;
            font-weight: 600;
        }

        /* ── States ── */
        .loading-state, .error-state {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            color: #888;
            font-size: 0.95rem;
        }

        .copy-feedback { display: none; }

        /* ── Designer row ── */
        #designerInfo {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            margin-bottom: 4px;
            padding: 4px 0;
        }

        /* ══════════════════════════════════════════════
           MOBILE  (≤ 768 px)
        ══════════════════════════════════════════════ */
        @media (max-width: 768px) {

            .produto-page {
                padding: 0;
            }

            .produto-header {
                padding: 14px 16px 0;
                flex-direction: column !important;
                align-items: flex-start !important;
                gap: 6px !important;
            }
            .btn-share {
                align-self: flex-start;
                padding: 6px 0;
                font-size: 0.9rem;
            }

            #designerInfo { padding: 0 16px; }

            .produto-body {
                grid-template-columns: 1fr;
                gap: 0;
                margin-top: 12px;
            }

            .produto-img-wrap {
                border-radius: 0;
                border-left: none;
                border-right: none;
                min-height: 260px;
                max-height: 320px;
                padding: 16px;
            }
            .produto-img-wrap img {
                max-height: 280px;
            }

            .img-side-btns {
                padding: 0 16px;
            }

            .produto-label { padding: 0 16px; }

            .selector-card {
                border-radius: 0;
                border-left: none;
                border-right: none;
                border-top: none;
                padding: 14px 16px;
            }

            .color-dot {
                width: 36px;
                height: 36px;
            }

            .size-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 8px;
            }

            .produto-actions {
                position: sticky;
                bottom: 0;
                z-index: 100;
                background: #fff;
                border-top: 1px solid #e0e0e0;
                padding: 10px 16px;
                margin: 0;
                gap: 8px;
            }
            .produto-actions .btn {
                font-size: 0.9rem;
                padding: 12px 8px;
            }

            .produto-right {
                background: #fff;
                border-top: 6px solid #f5f5f5;
                padding: 16px 16px 80px;
            }

            .input-group .form-control {
                font-size: 16px !important;
                min-height: 44px;
            }
            .input-group .btn {
                min-height: 44px;
                padding: 8px 14px;
            }
        }

        @media (max-width: 360px) {
            .size-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

<div class="produto-page">

    <!-- Loading -->
    <div id="loadingState" class="loading-state">
        <div class="spinner-border text-primary me-2" role="status"></div>
        Carregando produto...
    </div>

    <!-- Error -->
    <div id="errorState" class="error-state" style="display:none;">
        <i class="fas fa-exclamation-circle me-2 text-danger"></i>
        Produto não encontrado.
    </div>

    <!-- Content -->
    <div id="productContent" style="display:none;">

        <!-- Header -->
        <div class="produto-header d-flex align-items-start justify-content-between gap-3 flex-wrap">
            <div>
                <h1 id="productTitle">—</h1>
                <div id="productPrice" class="price">—</div>
            </div>
            <button class="btn-share" id="shareBtn" title="Compartilhar">
                <i class="fas fa-share-alt me-1"></i> Compartilhar
            </button>
        </div>

        <!-- Designer -->
        <div id="designerInfo" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;">
            <div style="display:flex;align-items:center;gap:8px;flex:1;">
                <img id="designerAvatar" src="" alt="Designer"
                     style="width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;">
                <span id="designerName" class="fw-semibold" style="font-size:0.9rem;"></span>
            </div>
        </div>

        <!-- Body -->
        <div class="produto-body">

            <!-- ── Left ── -->
            <div class="produto-left">

                <div class="produto-img-wrap" id="mainImgWrap">
                    <img id="mainProductImg" src="" alt="Produto">
                </div>

                <div class="img-side-btns" id="sideBtns" style="display:none;">
                    <button class="btn btn-sm btn-outline-secondary side-btn active" data-side="front">Frente</button>
                    <button class="btn btn-sm btn-outline-secondary side-btn" data-side="back">Costas</button>
                </div>

                <p class="produto-label">produto</p>

                <!-- Vinculated Art Section -->
                <div id="vinculatedArtSection" style="display:none;margin-bottom:16px;">
                    <div class="selector-card">
                        <h6 style="margin-bottom:12px;">
                            <i class="fas fa-image me-1"></i> Arte Vinculada
                        </h6>
                        <div id="vinculatedArtContainer"></div>
                    </div>
                </div>

                <div class="selector-card">
                    <h6>Cor</h6>
                    <div class="color-dots" id="colorDots"></div>
                    <small id="selected-color-name" class="mt-1 d-block"></small>
                </div>

                <div class="selector-card">
                    <h6>Tamanho</h6>
                    <div class="size-grid" id="sizeGrid"></div>
                </div>

                <div class="produto-actions">
                    <button class="btn btn-success" id="addToCartBtn" disabled>
                        <i class="fas fa-shopping-cart me-1"></i> Adicionar ao carrinho
                    </button>

                </div>

            </div>

            <!-- ── Right: Comments ── -->
            <div class="produto-right">
                <div class="comments-title">Comentários</div>

                <div id="commentsContainer" style="max-height:500px;overflow-y:auto;">
                    <p class="text-muted small">Carregando comentários...</p>
                </div>

                <div id="commentInputContainer" class="mt-1"></div>
            </div>

        </div><!-- /produto-body -->
    </div><!-- /productContent -->

</div><!-- /produto-page -->

<!-- Share Modal -->
<div class="modal fade" id="shareModal" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0 pb-0">
                <h6 class="modal-title">Compartilhar produto</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="text-muted small mb-2" id="shareModalProductName"></p>
                <div class="input-group">
                    <input type="text" class="form-control form-control-sm" id="shareLinkInput" readonly>
                    <button class="btn btn-outline-primary btn-sm" id="copyLinkBtn" type="button">
                        <i class="fas fa-copy"></i>
                    </button>
                </div>
                <div class="copy-feedback text-success small mt-1" id="copyFeedback">
                    <i class="fas fa-check me-1"></i>Link copiado!
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Shared managers -->
<script src="/javascript/shared-likes.js"></script>
<script src="/javascript/shared-comments.js"></script>
<script src="/javascript/shared-shipping.js"></script>

<!-- Página -->
<script src="/javascript/produto.js"></script>
<script src="/javascript/shared-art.js"></script> 

</body>
</html>
