<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedido - Kauara</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
    }
    .icon-wrap.pending  { background: #fff8e1; }
    .icon-wrap.approved { background: #e8f5e9; }
    .icon-wrap.rejected { background: #fce4ec; }
    .icon-wrap.timeout  { background: #e3f2fd; }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #ffd54f;
      border-top-color: #f9a825;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    h2 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #1a1a1a;
    }

    p {
      color: #555;
      line-height: 1.6;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .order-ref {
      margin-top: 16px;
      font-size: 0.82rem;
      color: #888;
      word-break: break-all;
    }

    .hint {
      font-size: 0.8rem;
      color: #aaa;
      margin-top: 8px;
    }

    .dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
      100% { content: ''; }
    }

    .btn {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary   { background: #1976d2; color: #fff; }
    .btn-secondary { background: #eee;    color: #333; }

    #pollInfo {
      margin-top: 20px;
      font-size: 0.78rem;
      color: #bbb;
    }
  </style>
</head>
<body>
  <div class="card" id="card"></div>
  <script src="/javascript/success.js"></script>
</body>
</html>
