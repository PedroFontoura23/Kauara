<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Profile</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .star { color: #ffd700; }
    </style>
</head>
<body>
    <header class="text-center py-4">
        <div class="container d-flex justify-content-between align-items-center">
            <!-- Left corner: Back button -->
            <div>
                <button onclick="history.back()" class="btn btn-secondary">← Voltar</button>
            </div>
        </div>
    </header>
    <div class="container mt-5 text-center">
        <h1 id="userName">Loading...</h1>
        <img id="profilePicture" src="../images/default-profile.png" alt="Profile Picture" class="rounded-circle" width="150">
        <p><strong>Email:</strong> <span id="userEmail">Loading...</span></p>
        <p><strong>Bio:</strong> <span id="userBio">Loading...</span></p>
        <div id="ratingContainer"></div>
    </div>

    <div class="container mt-4">
        <h3>User Posts</h3>
        <div id="postsContainer"></div>
    </div>
    <div class="container mt-4">
        <div id="productsContainer"></div>
    </div>
    <script src="../javascript/shared-posts.js"></script>
    <script src="../javascript/rating.js"></script>
    <script src="../javascript/shared-products.js"></script>  <!-- Added this line -->
    <script src="../javascript/public-profile.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
