<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Create New Product</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Bootstrap CSS and Cropper.js CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/cropperjs/dist/cropper.min.css"
    />
    <style>
      /* Optional: style for the design preview */
      #designPreview {
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <h1>Create New Product</h1>
      <form id="createProductForm">
        <div class="mb-3">
          <label for="productName" class="form-label">Name of Product</label>
          <input
            type="text"
            id="productName"
            class="form-control"
            placeholder="Enter product name"
            required
          />
        </div>
        <div class="mb-3">
          <label for="productTemplate" class="form-label">Product Template</label>
          <select id="productTemplate" class="form-control" required>
            <option value="">Select a template</option>
            <!-- Options will be populated dynamically -->
          </select>
        </div>
        <div class="mb-3">
          <label for="designUpload" class="form-label">Upload Design</label>
          <input
            type="file"
            id="designUpload"
            class="form-control"
            accept="image/*"
            required
          />
        </div>
        <div class="mb-3">
          <img id="designPreview" src="" alt="Design Preview" style="display: none;" />
        </div>
        <!-- Buttons to optionally re-edit/save the design -->
        <div class="mb-3">
          <button type="button" id="editDesignBtn" class="btn btn-secondary" style="display: none;">
            Edit Design
          </button>
          <button type="button" id="saveDesignBtn" class="btn btn-primary" style="display: none;">
            Save Design
          </button>
        </div>
        <div class="mb-3">
          <label for="productDescription" class="form-label">Product Description</label>
          <textarea
            id="productDescription"
            class="form-control"
            rows="3"
            placeholder="Enter product description"
            required
          ></textarea>
        </div>
        <div class="mb-3">
          <label for="productPrice" class="form-label">Product Price</label>
          <input
            type="text"
            id="productPrice"
            class="form-control"
            placeholder="Calculated price"
            readonly
          />
        </div>
        <div class="mb-3">
          <button type="submit" id="uploadProductBtn" class="btn btn-success">
            Upload Product
          </button>
        </div>
      </form>
    </div>

    <!-- Modal for cropping the design image -->
    <div class="modal fade" id="cropModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Crop and Edit Design</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <img id="cropImage" src="" alt="Crop Image" style="max-width: 100%;" />
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button type="button" id="cropSaveBtn" class="btn btn-primary">
              Save Crop
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Required scripts: Bootstrap JS, Cropper.js, Firebase, CryptoJS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cropperjs/dist/cropper.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <!-- Our custom JavaScript file for product creation -->
    <script src="/javascript/create_product.js"></script>
  </body>
</html>
