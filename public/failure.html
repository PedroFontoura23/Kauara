<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Não Aprovado - Kauara Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow">
            <div class="card-header bg-danger text-white">
                <h3 class="mb-0"><i class="fas fa-times-circle me-2"></i> Pagamento Não Aprovado</h3>
            </div>
            <div class="card-body text-center py-5">
                <i class="fas fa-times-circle fa-5x text-danger mb-4"></i>
                <h4 class="mb-3">Seu pagamento não foi aprovado</h4>
                <p class="text-muted mb-4">Infelizmente não foi possível processar seu pagamento. Você pode tentar novamente com outro método de pagamento.</p>
                
                <div class="d-grid gap-2 d-md-block">
                    <a href="https://kauava.com" class="btn btn-primary me-2">
                        <i class="fas fa-home me-1"></i> Voltar para a Loja
                    </a>
                    <button data-action="goBack" class="btn btn-outline-secondary">
                        <i class="fas fa-redo me-1"></i> Tentar Novamente
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="/javascript/csp-event-delegation.js"></script>
</body>
</html>
