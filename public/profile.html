<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <header class="text-center py-4">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <button id="backButton" class="btn btn-secondary">← Voltar</button>
            </div>
            <div class="d-flex align-items-center gap-2">
                <button id="cartButton" class="btn btn-outline-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-cart" viewBox="0 0 16 16">
                        <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM3.102 4l1.313 7h8.17l1.313-7H3.102zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                    </svg>
                    Carrinho
                </button>
            </div>
            <div class="dropdown">
                <button class="btn btn-primary dropdown-toggle" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                    Menu
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuButton">
                    <li>
                        <button class="dropdown-item" type="button" data-bs-toggle="collapse" data-bs-target="#contaOptions" aria-expanded="false" aria-controls="contaOptions">
                            Conta
                        </button>
                        <div class="collapse" id="contaOptions">
                            <ul class="list-unstyled ps-3">
                                <li><button id="logoutButton" class="dropdown-item btn btn-danger">Log out</button></li>
                                <li><button id="deleteAccountButton" class="dropdown-item btn btn-danger">Deletar conta</button></li>
                                <li><button id="becomeArtistButton" class="dropdown-item btn btn-success">Seja um Artista</button></li>
                            </ul>
                        </div>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <button class="dropdown-item" type="button" data-bs-toggle="collapse" data-bs-target="#segurancaOptions" aria-expanded="false" aria-controls="segurancaOptions">
                            Segurança
                        </button>
                        <div class="collapse" id="segurancaOptions">
                            <ul class="list-unstyled ps-3">
                                <li><button class="dropdown-item" type="button" data-bs-toggle="modal" data-bs-target="#trocarSenhaModal">Trocar de senha</button></li>
                                <li><button class="dropdown-item" type="button" data-bs-toggle="modal" data-bs-target="#trocarEmailModal">Trocar de email</button></li>
                            </ul>
                        </div>
                    </li>
                </ul>
            </div>

            <!-- Modals (unchanged) -->
            <div class="modal fade" id="trocarSenhaModal" tabindex="-1" aria-labelledby="trocarSenhaModalLabel" aria-inert="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="trocarSenhaModalLabel">Trocar de Senha</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <p>Formulário para trocar senha virá aqui.</p>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                            <button type="button" class="btn btn-primary">Salvar</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal fade" id="trocarEmailModal" tabindex="-1" aria-labelledby="trocarEmailModalLabel" aria-inert="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="trocarEmailModalLabel">Trocar de Email</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <p>Formulário para trocar email virá aqui.</p>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                            <button type="button" class="btn btn-primary">Salvar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container mt-4 text-center">
        <div id="profile" class="row justify-content-center text-center">
            <p></p>
            <div class="col-12 col-md-6">
                <div class="mb-4">
                    <img id="profilePicture" src="/images/default-profile.png" alt="Profile Picture" class="rounded-circle" width="150">
                    <p></p>
                    <button id="uploadPictureButton" class="btn btn-primary mt-2">Change Picture</button>
                </div>
            </div>
        </div>

        <h1 id="userName">Full Name</h1>
        <span id="artistaBadge" style="display: none; color: blue; font-weight: bold;">#Artista#</span>
        <p id="userEmail">email</p>

        <div class="container mt-4 text-center">
            <button id="editNameButton" class="btn btn-primary">Edit Name</button>
            <p></p>
        </div>
        <div id="nameEditSection" style="display: none;" class="mt-3">
            <input type="text" id="nameInput" class="form-control" placeholder="Enter your name" />
            <button id="saveNameButton" class="btn btn-success mt-2">Save Name</button>
            <button id="cancelNameButton" class="btn btn-secondary mt-2">Cancel</button>
        </div>

        <div class="container mt-4 text-center">
            <p><strong>Bio:</strong> <span id="userBio">No bio available. Click edit to add one.</span></p>
            <button id="editBioButton" class="btn btn-primary">Edit Bio</button>
        </div>
        <div id="bioEditSection" style="display: none;">
            <input type="text" id="bioInput" class="form-control" placeholder="Enter your bio" />
            <button id="saveBioButton" class="btn btn-success mt-2">Save Bio</button>
            <button id="cancelBioButton" class="btn btn-secondary mt-2">Cancel</button>
        </div>

        <!-- Modal: Crop profile picture -->
        <div class="modal" id="cropModal" tabindex="-1" aria-labelledby="cropModalLabel" aria-inert="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="cropModalLabel">Crop Profile Picture</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <img id="cropImage" src="" alt="Crop Image" class="img-fluid">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" id="cropButton" class="btn btn-primary">Save Crop</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="rating-container text-center mt-3">
            <h4 class="rating-title">Your Shared Rating</h4>
            <div class="rating-value">
                <span id="averageRating" class="h3 me-2">Loading...</span>
                <span id="numberOfRatings" class="text-muted">(0 likes)</span>
            </div>
        </div>
    </main>

    <div class="container mt-4">
        <div class="d-flex justify-content-center mb-4">
            <button id="addPostButton" class="btn btn-primary" style="display: none;">Create New Post</button>
        </div>
    </div>
    <div class="container mt-4">
        <div class="d-flex justify-content-center mb-4">
            <button id="createProductButton" class="btn btn-primary">Create New Product</button>
        </div>
    </div>

    <div id="allPostsContainer" class="container mt-4"></div>
    <div id="productsContainer" class="container mt-4"></div>
    <div id="artContainer"      class="container mt-4"></div>
    <div id="candidatoArtsContainer" class="container mt-4"></div>

    <!-- Modal: Create Post -->
    <div class="modal" id="postModal" tabindex="-1" aria-inert="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create Post</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <textarea id="postText" class="form-control mb-3" rows="3" placeholder="What's on your mind?"></textarea>
                    <input type="file" id="postImageInput" class="form-control mb-3" accept="image/*">
                    <img id="postImagePreview" class="img-fluid d-none mb-3" alt="Preview">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="submitPostButton">Post</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="cropPostModal" tabindex="-1" aria-labelledby="cropPostModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="cropPostModalLabel">Adjust Your Design</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="cropPostImage" src="" alt="Crop preview" class="img-fluid border rounded">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="cropPostButton">Crop</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cpf-cnpj-validator/dist/cpf-cnpj-validator.min.js"></script>
    <script src="/javascript/shared-likes.js"></script>
    <script src="/javascript/shared-comments.js"></script>
    <script src="/javascript/shared-posts.js"></script>
    <script src="/javascript/shared-art.js"></script>
    <script src="/javascript/shared-products-dimona.js"></script>
    <script src="/javascript/shared-candidatos.js"></script>
    <script src="/javascript/profile.js"></script>
</body>
</html>
