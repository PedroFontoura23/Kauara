<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kauara – Seja um Artista</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #f9f6f2;
            color: #1a1410;
        }

        .artist-hero {
            max-width: 560px;
            margin: 80px auto;
            padding: 0 24px;
        }

        .artist-hero__eyebrow {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: #c8855a;
            margin-bottom: 16px;
        }

        .artist-hero__title {
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 700;
            line-height: 1.15;
            margin: 0 0 16px;
        }

        .artist-hero__desc {
            font-size: 16px;
            line-height: 1.7;
            color: #6b6460;
            margin: 0 0 32px;
        }

        #showArtistModalBtn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            background: #1a1410;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background .2s, transform .15s;
        }

        #showArtistModalBtn:hover {
            background: #2e2520;
            transform: translateY(-1px);
        }

        #showArtistModalBtn.is-edit {
            background: #4a7c59;
        }

        #showArtistModalBtn.is-pending {
            background: #b07830;
        }

        /* Skeleton shimmer while auth loads */
        #showArtistModalBtn.is-loading {
            background: #e0d8d0;
            color: transparent;
            pointer-events: none;
            position: relative;
            overflow: hidden;
        }

        #showArtistModalBtn.is-loading::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.5) 50%, transparent 100%);
            animation: shimmer 1.2s infinite;
        }

        @keyframes shimmer {
            from { transform: translateX(-100%); }
            to   { transform: translateX(100%); }
        }
    </style>
</head>
<body>

    <section class="artist-hero">
        <p class="artist-hero__eyebrow">✦ Kauara para Artistas</p>
        <h1 class="artist-hero__title">Torne-se um<br>artista Kauara</h1>
        <p class="artist-hero__desc">
            Compartilhe sua arte, alcance novos públicos e venda suas obras diretamente pela plataforma — sem intermediários.
        </p>
        <button id="showArtistModalBtn" class="is-loading">Carregando…</button>
    </section>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>

    <script src="/javascript/artist-registration.js"></script>

</body>
</html>
