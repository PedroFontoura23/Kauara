<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Profile</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .star { color: #ffd700; }
        .artist-badge {
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
            margin-left: 10px;
        }
        .modal-backdrop {
            z-index: 1040 !important;
        }
        .modal {
            z-index: 1050 !important;
        }
    </style>
</head>
<body>
    <header class="text-center py-4">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <button data-action="navigate" data-target="inicio.html" class="btn btn-secondary">← Back to Home</button>
            </div>
        </div>
    </header>
    <div class="container mt-5 text-center">
        <h1 id="userName">Loading...</h1>
        <img id="profilePicture" src="../images/default-profile.png" alt="Profile Picture" class="rounded-circle" width="150">
        <p><strong>Email:</strong> <span id="userEmail">Loading...</span></p>
        <p><strong>Bio:</strong> <span id="userBio">Loading...</span></p>
        <div id="ratingContainer"></div>
    </div>

    <!-- Candidate Arts Section -->
    <div class="container mt-4">
        <h3>Candidate Arts</h3>
        <div id="candidatoArtsContainer"></div>
    </div>

    <!-- User Arts Section -->
    <div class="container mt-4">
        <h3>User Arts</h3>
        <div id="artsContainer"></div>
    </div>

    <!-- User Products Section -->
    <div class="container mt-4">
        <h3>User Products</h3>
        <div id="productsContainer"></div>
    </div>

    <!-- User Posts Section -->
    <div class="container mt-4">
        <h3>User Posts</h3>
        <div id="postsContainer"></div>
    </div>

    <!-- Scripts -->
    <script src="/javascript/shared-likes.js"></script>
    <script src="/javascript/shared-comments.js"></script>
    <script src="/javascript/shared-posts.js"></script>
    <script src="/javascript/shared-art.js"></script>
    <script src="/javascript/shared-firebase-init.js"></script>
    <script src="/javascript/shared-products-dimona.js"></script>
    <script src="/javascript/shared-candidatos.js"></script>
    <script src="/javascript/csp-event-delegation.js"></script>
    <script src="/javascript/public-profile.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
