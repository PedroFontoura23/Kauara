<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Profile</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .star { color: #ffd700; }
        #donationSection {
            display: none; /* Hidden by default */
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
        }
        #donateButton img {
            vertical-align: middle;
        }
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #pixLoading {
            text-align: center;
            margin: 10px 0;
        }
        .art-card, .product-card {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .art-image, .product-image {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }
        .user-profile-link {
            cursor: pointer;
        }
        .user-profile-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header class="text-center py-4">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <button onclick="window.location.href='inicio.html'" class="btn btn-secondary">← Back to Home</button>
            </div>
        </div>
    </header>
    <div class="container mt-5 text-center">
        <h1 id="userName">Loading...</h1>
        <img id="profilePicture" src="../images/default-profile.png" alt="Profile Picture" class="rounded-circle" width="150">
        <p><strong>Email:</strong> <span id="userEmail">Loading...</span></p>
        <p><strong>Bio:</strong> <span id="userBio">Loading...</span></p>
        <div id="ratingContainer"></div>
    </div>

    <!-- Donation Section (hidden by default) -->
    <div id="donationSection" class="container mt-4 text-center">
        <div class="pix-section">
            <h4>Doar com PIX</h4>
            <input type="number" id="pixAmount" class="form-control w-25 d-inline-block" placeholder="Valor em R$" min="1" step="0.01">
            <button id="pixPayBtn" class="btn btn-success ms-2">Gerar QR Code</button>
        </div>
        <div id="pixQrCode" class="container text-center mt-3"></div>
        <div id="pixLoading" class="container text-center">
            <div class="loading-spinner"></div>
            <p>Generating QR Code...</p>
        </div>
    </div>

    <!-- User Arts Section -->
    <div class="container mt-4">
        <h3>User Arts</h3>
        <div id="artsContainer"></div>
    </div>

    <!-- User Products Section -->
    <div class="container mt-4">
        <h3>User Products</h3>
        <div id="productsContainer"></div>
    </div>

    <!-- User Posts Section -->
    <div class="container mt-4">
        <h3>User Posts</h3>
        <div id="postsContainer"></div>
    </div>

    <!-- Scripts -->
    <script src="/javascript/shared-posts.js"></script>
    <script src="/javascript/shared-art.js"></script>
    <script src="/javascript/shared-products.js"></script>
    <script src="/javascript/rating.js"></script>
    <script src="/javascript/public-profile.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
