<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doação</title>
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js"></script>
    <script src="../javascript/pagamentos.js" defer></script>
</head>
<body>
    <h2>Fazer uma Doação</h2>
    <p>Doação para <strong id="recipientName"></strong></p>
    
    <label for="donationAmount">Valor da Doação (R$):</label>
    <input type="number" id="donationAmount" placeholder="Digite o valor" min="1">

    <button onclick="donate()">Doar com Mercado Pago</button>

    <div id="paymentContainer"></div> <!-- PIX QR Code aparecerá aqui -->

    <p id="loadingMessage" style="display: none;">Gerando pagamento...</p>
</body>
</html>
