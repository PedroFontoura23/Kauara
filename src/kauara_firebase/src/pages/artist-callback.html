<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kauara - Artist Connection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase.js"></script>
    <script src="https://sdk.mercadopago.com/js/v2"></script>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card shadow-lg" style="max-width: 500px; width: 100%;">
            <div class="card-body text-center p-5">
                <div id="loading">
                    <div class="spinner-border text-primary mb-4" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <h2 class="h4 mb-3">Processing Your Connection</h2>
                    <p class="text-muted">Please wait while we finalize your registration...</p>
                </div>
                
                <div id="success" style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-check-circle-fill text-success mb-4" viewBox="0 0 16 16">
                        <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                    </svg>
                    <h2 class="h4 mb-3">Connection Successful!</h2>
                    <p class="mb-4">Your account has been successfully connected.</p>
                    <button id="continueButton" class="btn btn-primary">Continue to Artist Page</button>
                </div>
                
                <div id="error" style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-exclamation-triangle-fill text-danger mb-4" viewBox="0 0 16 16">
                        <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                    </svg>
                    <h2 class="h4 mb-3">Connection Error</h2>
                    <p id="errorMessage" class="mb-4">There was a problem with the connection.</p>
                    <button id="retryButton" class="btn btn-primary">Retry</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async function() {
            console.log("Artist Callback Loaded");

            // Initialize Firebase with real config
            const firebaseConfig = {
                apiKey: "AIzaSyBcBmuXY9ulETrbn2PmzjsDZ7JKRcehqGo",
                authDomain: "kauara1.firebaseapp.com",
                projectId: "kauara1",
                storageBucket: "kauara1.firebasestorage.app",
                messagingSenderId: "651139031771",
                appId: "1:651139031771:web:8c73a3e1fff2d5cf2ae2fe",
                measurementId: "G-KL18R1CJ6S",
            };
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            const db = firebase.firestore();

            // Constants
            const MERCADO_PAGO_CLIENT_ID = "8000562204726523";
            const REDIRECT_URI = "https://kauara1.web.app/pages/artist-callback.html";

            // Parse URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            console.log("URL Params:", urlParams.toString());

            const mpCode = urlParams.get('code');
            const state = urlParams.get('state');
            const error = urlParams.get('error');
            const errorDescription = urlParams.get('error_description');

            // Handle errors from Mercado Pago
            if (error) {
                console.error("Mercado Pago Error:", error, errorDescription);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('errorMessage').textContent =
                    `Error: ${error}. ${errorDescription || 'Authorization was denied or an error occurred.'}`;
                document.getElementById('retryButton').addEventListener('click', function() {
                    window.location.href = '/pages/artistRegistration.html';
                });
                return;
            }

            // Validate necessary parameters
            if (!mpCode || !state) {
                console.error("Missing required parameters for authentication.");
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('errorMessage').textContent = "Missing required parameters for authentication.";
                document.getElementById('retryButton').addEventListener('click', function() {
                    window.location.href = '/pages/artistRegistration.html';
                });
                return;
            }

            // Exchange the authorization code for a token
            try {
                const codeVerifier = localStorage.getItem("mp_code_verifier");
                const response = await fetch('https://api.mercadopago.com/oauth/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'application/json' },
                    body: new URLSearchParams({
                        'client_id': MERCADO_PAGO_CLIENT_ID,
                        'client_secret': 'EQhcpoRF4HIg8wvwE3udiQgK0f8kfAsR',
                        'grant_type': 'authorization_code',
                        'code': mpCode,
                        'redirect_uri': REDIRECT_URI,
                        'code_verifier': codeVerifier
                    })
                });

                const result = await response.json();
                if (result.access_token) {
                    // Update Firebase
                    await db.collection("users").doc(state).update({
                        mercadoPagoConnected: true,
                        mercadoPagoUserId: result.user_id,
                        mercadoPagoTokenRef: result.access_token,
                        mercadoPagoConnectedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    // Show success and redirect
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('success').style.display = 'block';
                    document.getElementById('continueButton').addEventListener('click', function() {
                        window.location.href = '/pages/artistRegistration.html';
                    });

                    // Auto-redirect after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/pages/artistRegistration.html';
                    }, 2000);
                } else {
                    throw new Error("No access token received from Mercado Pago.");
                }
            } catch (error) {
                console.error("Error exchanging Mercado Pago token:", error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('errorMessage').textContent = "Error connecting Mercado Pago: " + error.message;
                document.getElementById('retryButton').addEventListener('click', function() {
                    window.location.href = '/pages/artistRegistration.html';
                });
            }
        });
    </script>
</body>
</html>
