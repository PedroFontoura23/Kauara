<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Posts Template</title>
    <!-- Include necessary CSS and Firebase libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <!-- Add your custom CSS here -->
    <style>
        .comments-container {
            max-height: 300px; /* Adjust the height as needed */
            overflow-y: auto; /* Enable vertical scrolling */
            border: 1px solid #ddd; /* Optional: Add a border */
            border-radius: 4px; /* Optional: Add rounded corners */
            padding: 10px; /* Optional: Add padding */
            margin-bottom: 10px; /* Optional: Add margin */
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h3>Posts</h3>
        <div id="postsContainer">
            <!-- Posts will be dynamically loaded here by PostManager -->
        </div>
    </div>

    <!-- Template for a post -->
    <template id="postTemplate">
        <div class="card mb-4">
            <div class="card-header d-flex align-items-center">
                <img src="{{profilePicture}}" 
                     class="rounded-circle me-2 user-profile-link" 
                     alt="Profile Picture" 
                     style="width: 40px; height: 40px; object-fit: cover; cursor: pointer;" 
                     data-user-id="{{foreignUserId}}">
                <div>
                    <h6 class="mb-0 user-profile-link" style="cursor: pointer;" data-user-id="{{foreignUserId}}">
                        {{userName}}
                    </h6>
                    <small class="text-muted">{{formattedDate}}</small>
                </div>
            </div>
            <div class="card-body">
                <p class="card-text">{{postText}}</p>
                {{#if postImage}}
                    <img src="{{postImage}}" 
                         class="img-fluid rounded lazy-load" 
                         alt="Post Image" 
                         style="max-height: 500px; width: auto;" 
                         loading="lazy">
                {{/if}}
            </div>
            <div class="card-footer">
                <!-- Like Button -->
                <button class="btn btn-outline-primary like-button" data-post-id="{{postId}}">
                    <span class="like-count">{{likesCount}}</span> Likes
                </button>

                <!-- Comments Button -->
                <button class="btn btn-outline-secondary comments-toggle-button" data-post-id="{{postId}}">
                    Show Comments
                </button>

                <!-- Comments Container (Hidden by Default) -->
                <div class="comments-container mt-3" id="comments-{{postId}}" style="display: none;"></div>

                <!-- Comment Input Section -->
                <div class="input-group mt-2">
                    <input type="text" class="form-control comment-input" placeholder="Write a comment..." id="commentInput-{{postId}}">
                    <button class="btn btn-outline-primary comment-submit" data-post-id="{{postId}}">Post</button>
                </div>

                <!-- Delete Post Button (if applicable) -->
                {{#if isCurrentUserPost}}
                    <button class="btn btn-danger mt-2 delete-post-button" data-post-id="{{postId}}">Delete Post</button>
                {{/if}}
            </div>
        </div>
    </template>

    <script>
        // Firebase configuration (replace with your actual config)
        const firebaseConfig = {
            apiKey: "AIzaSyBcBmuXY9ulETrbn2PmzjsDZ7JKRcehqGo",
            authDomain: "kauara1.firebaseapp.com",
            projectId: "kauara1",
            storageBucket: "kauara1.firebasestorage.app",
            messagingSenderId: "651139031771",
            appId: "1:651139031771:web:8c73a3e1fff2d5cf2ae2fe",
            measurementId: "G-KL18R1CJ6S"
        };



        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);

        // Script to initialize post manager
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize the PostManager
            const postManager = initializePostManager('postsContainer');
            
            // Example: Display all posts
            postManager.displayPosts();

            // Example: Display posts for a specific user
            // postManager.displayPosts('specific-user-id');
        });
    </script>

    <!-- Include your custom JavaScript file -->
    <script src="../javascript/shared-posts.js"></script>
</body>
</html>
