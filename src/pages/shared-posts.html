<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Posts Template</title>
    <!-- Include necessary CSS and Firebase libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
</head>
<body>
    <div class="container mt-4">
        <h3>Posts</h3>
        <div id="postsContainer">
            <!-- Posts will be dynamically loaded here by PostManager -->
        </div>
    </div>

    <script>
        // Firebase configuration (you'll replace this with your actual config)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            // ... other config details
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);

        // Script to initialize post manager
        document.addEventListener('DOMContentLoaded', () => {
            const postManager = initializePostManager('postsContainer');
            
            // Example: Display all posts
            postManager.displayPosts();

            // Example: Display posts for a specific user
            // postManager.displayPosts('specific-user-id');
        });
    </script>
    <script src="..javascript//shared-posts.js"></script>
</body>
</html>
