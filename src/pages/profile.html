<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.css" rel="stylesheet">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <header class="text-center py-4">
        <div class="container d-flex justify-content-between align-items-center">
            <!-- Left corner: Back button -->
            <div>
                <button onclick="history.back()" class="btn btn-secondary">← Voltar</button>
            </div>
            <!-- Right corner: Dropdown menu -->
            <div class="dropdown">
                <!-- Botão do menu -->
                <button class="btn btn-primary dropdown-toggle" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                    Menu
                </button>
                <!-- Itens do menu -->
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuButton">
                    <!-- Log out button section -->
                    <li>
                        <button id="logoutButton" class="dropdown-item btn btn-danger">Log Out</button>
                    </li>
                    <!-- Divider -->
                    <li><hr class="dropdown-divider"></li>
                    <!-- Delete button section -->
                    <li>
                        <button id="deleteAccountButton" class="dropdown-item btn btn-danger">Delete Account</button>
                    </li>
                </ul>
            </div>
        </div>
    </header>

    <main class="container mt-4 text-center">
        <!--Image handling section -->
        <div id="profile" class="row justify-content-center text-center">
            <p></p>
            <div class="col-12 col-md-6">
                <div class="mb-4">
                    <img id="profilePicture" src="../images/default-profile.png" alt="Profile Picture" class="rounded-circle" width="150">
                    <p></p>
                    <button id="uploadPictureButton" class="btn btn-primary mt-2">Change Picture</button>
                </div>
            </div>
        </div>

        <!--NOME -->
        <h1 id="userName">Full Name</h1>
        <p id="userEmail">email</p>
        <!-- Edicao do nome -->
        <div class="container mt-4 text-center">
            <button id="editNameButton" class="btn btn-primary">Edit Name</button>
            <p></p>
        </div>
        <div id="nameEditSection" style="display: none;" class="mt-3">
            <input type="text" id="nameInput" class="form-control" placeholder="Enter your name" />
            <button id="saveNameButton" class="btn btn-success mt-2">Save Name</button>
            <button id="cancelNameButton" class="btn btn-secondary mt-2">Cancel</button>
        </div>

        <div class="container mt-4 text-center">
            <p><strong>Bio:</strong> <span id="userBio">No bio available. Click edit to add one.</span></p>
            <button id="editBioButton" class="btn btn-primary">Edit Bio</button>
        </div>

        <!-- Bio Edit Section -->
        <div id="bioEditSection" style="display: none;">
            <input type="text" id="bioInput" class="form-control" placeholder="Enter your bio" />
            <button id="saveBioButton" class="btn btn-success mt-2">Save Bio</button>
            <button id="cancelBioButton" class="btn btn-secondary mt-2">Cancel</button>
        </div>

        <!-- Modal for uploading and cropping image -->
        <div class="modal" id="cropModal" tabindex="-1" aria-labelledby="cropModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="cropModalLabel">Crop Profile Picture</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <img id="cropImage" src="" alt="Crop Image" class="img-fluid">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" id="cropButton" class="btn btn-primary">Save Crop</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Average rating -->
        <div class="container mt-4 text-center">
            <p><strong>Average Rating:</strong> <span id="userRating">No ratings yet</span></p>
        </div>

    </main>

        <!-- Add this new section for posts after the rating section -->
        <div class="container mt-4">
            <div class="d-flex justify-content-center mb-4">
                <button id="addPostButton" class="btn btn-primary">
                    Create New Post
                </button>
            </div>
        </div>

        <!-- Container for posts -->
        <div id="allPostsContainer" class="container mt-4"></div>
    </main>

    <!-- Post Modal -->
    <div class="modal" id="postModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create Post</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <textarea id="postText" class="form-control mb-3" rows="3" placeholder="What's on your mind?"></textarea>
                    <input type="file" id="postImageInput" class="form-control mb-3" accept="image/*">
                    <img id="postImagePreview" class="img-fluid d-none mb-3" alt="Preview">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="submitPostButton">Post</button>
                </div>
            </div>
        </div>
    </div>


    <!-- Crop Modal -->
    <div class="modal" id="cropPostModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Crop Image</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <img id="cropPostImage" src="" alt="Crop preview">
                    <div class="preview"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="cropPostButton">Crop</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.js"></script>
    <script src="../javascript/shared-posts.js"></script>
    <script src="../javascript/profile.js"></script>
</body>
</html>
