<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    <header class="text-center py-4">
    </header>

    <main class="container mt-4 text-center">
        <h1 id="userName">Full Name</h1>
        <p id="userEmail">email</p>
        <!-- Name Edit Section -->
        <div class="container mt-4 text-center">
            <button id="editNameButton" class="btn btn-primary">Edit Name</button>
            <p></p>
        </div>
        <div id="nameEditSection" style="display: none;" class="mt-3">
            <input type="text" id="nameInput" class="form-control" placeholder="Enter your name" />
            <button id="saveNameButton" class="btn btn-success mt-2">Save Name</button>
            <button id="cancelNameButton" class="btn btn-secondary mt-2">Cancel</button>
        </div>
        <!--Image handling section -->
        <div id="profile" class="row justify-content-center text-center">
            <p></p>
            <div class="col-12 col-md-6">
                <div class="mb-4">
                    <img id="profilePicture" src="default-profile.png" alt="Profile Picture" class="rounded-circle" width="150">
                    <p></p>
                    <button id="uploadPictureButton" class="btn btn-primary mt-2">Change Picture</button>
                </div>
            </div>
        </div>

        <div class="container mt-4 text-center">
            <p><strong>Bio:</strong> <span id="userBio">No bio available. Click edit to add one.</span></p>
            <button id="editBioButton" class="btn btn-primary">Edit Bio</button>
        </div>

        <!-- Bio Edit Section -->
        <div id="bioEditSection" style="display: none;">
            <input type="text" id="bioInput" class="form-control" placeholder="Enter your bio" />
            <button id="saveBioButton" class="btn btn-success mt-2">Save Bio</button>
            <button id="cancelBioButton" class="btn btn-secondary mt-2">Cancel</button>
        </div>

        <!-- Modal for uploading and cropping image -->
        <div class="modal" id="cropModal" tabindex="-1" aria-labelledby="cropModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="cropModalLabel">Crop Profile Picture</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <img id="cropImage" src="" alt="Crop Image" class="img-fluid">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" id="cropButton" class="btn btn-primary">Save Crop</button>
                    </div>
                </div>
            </div>
        </div>

        <!--Log out button section-->
        <div>
            <p></p>
            <p></p>
            <button id="logoutButton" class="btn btn-danger">Log Out</button>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.js"></script>
    <script src="profile.js"></script>
</body>
</html>
